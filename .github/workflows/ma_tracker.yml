name: MA Tracker

on:
  schedule:
    - cron: "30 23 * * 1-5"   # 台北 週二~週六 07:30（美股收盤後）
    - cron: "45 6 * * 1-5"    # 台北 週一~週五 14:45（台股收盤後）
  workflow_dispatch:           # 手動執行

permissions:
  contents: write

concurrency:
  group: ma-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Test rebound rules
        run: python -m pytest -q tests

      - name: Run TAIEX rebound tracker
        env:
          TZ: Asia/Taipei
        run: python taiex_rebound.py || echo "TAIEX tracker failed, page keeps last card"

      - name: Run tracker
        env:
          TZ: Asia/Taipei
        run: python ma_tracker.py

      - name: Run industry map
        env:
          TZ: Asia/Taipei
        run: python industry_map.py

      # Pages 從 main 根目錄發布，push 後自動更新網頁
      - name: Prepare Pages
        run: |
          cp output/latest.html index.html
          cp output/latest.csv latest.csv
          cp output/industry_map.html industry.html

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ index.html latest.csv industry.html
          git diff --cached --quiet || git commit -m "MA tracker $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          # 兩次執行重疊時，產出檔以本次結果為準（rebase 中 theirs = 本次 commit），推送失敗重試 3 次
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
