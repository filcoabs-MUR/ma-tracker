name: MA Tracker

on:
  schedule:
    - cron: "30 23 * * 1-5"   # 台北 週二~週六 07:30（美股收盤後）
    - cron: "45 6 * * 1-5"    # 台北 週一~週五 14:45（台股收盤後）
  workflow_dispatch:           # 手動執行

permissions:
  contents: write

concurrency:
  group: ma-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          TZ: Asia/Taipei
        run: python ma_tracker.py

      # Pages 從 main 根目錄發布，push 後自動更新網頁
      - name: Prepare Pages
        run: |
          cp output/latest.html index.html
          cp output/latest.csv latest.csv

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ index.html latest.csv
          git diff --cached --quiet || git commit -m "MA tracker $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
